<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Human-like Memory</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="dot"></span>
        <h1>Human-like Memory</h1>
        <span class="ver" id="semanticBadge"></span>
      </div>
      <button class="ghost" id="refreshBtn">刷新</button>
    </header>

    <section class="stats" id="stats"></section>

    <section class="filters">
      <select id="fStatus">
        <option value="">全部状态</option>
        <option value="candidate">暂存</option>
        <option value="active">正式</option>
        <option value="dormant">待定</option>
        <option value="archived">遗忘库</option>
        <option value="expired">过期</option>
      </select>
      <select id="fType">
        <option value="">全部类型</option>
        <option value="command">命令</option>
        <option value="promise">承诺</option>
        <option value="praise">夸奖</option>
        <option value="blame">批评</option>
        <option value="fact">事实</option>
        <option value="emotion">情绪</option>
        <option value="request">提问</option>
        <option value="smalltalk">闲聊</option>
      </select>
      <input id="fQ" type="search" placeholder="搜内容…" />
      <button class="primary" id="searchBtn">查找</button>
    </section>

    <section class="list" id="list"></section>

    <nav class="pager" id="pager"></nav>

    <div class="detail-mask" id="mask">
      <div class="detail">
        <header>
          <h2 id="dTitle">记忆详情</h2>
          <button class="ghost" id="closeBtn">关闭</button>
        </header>
        <div id="dBody"></div>
      </div>
    </div>

    <footer class="foot">
      <span id="footHint">加载中…</span>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
